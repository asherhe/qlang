<style>/* === MANDATORY FIXED STAGE === */
/* ===========================================
   FIXED 16:9 STAGE: MANDATORY BASE STYLES
   Include this ENTIRE file in every presentation.
   Slides are authored at 1920×1080 and scaled as a whole.
   =========================================== */

/* 1. Lock the browser viewport */
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}

/* 2. Full-window deck viewport */
.deck-viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}

/* 3. Fixed 16:9 design canvas.
   JavaScript sets transform: translate(...) scale(...). */
.deck-stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}

/* 4. Slides stack inside the fixed stage.
   Content must be laid out at 1920×1080, not reflowed per device. */
.slide {
    position: absolute;
    inset: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    display: block;
    visibility: hidden;
    opacity: 0;
    pointer-events: none;
    background: var(--slide-bg, #fff);
}

.slide.active,
.slide.visible {
    visibility: visible;
    opacity: 1;
    pointer-events: auto;
    z-index: 1;
}

/* 5. Keep media inside authored slide bounds */
img,
video,
canvas,
svg {
    max-width: 100%;
    max-height: 100%;
}

/* 6. Presentation chrome stays outside the slide design system */
.deck-controls {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    z-index: 1000;
}

/* 7. Print one fixed-size slide per page */
@media print {
    html,
    body {
        width: 1920px;
        height: auto;
        overflow: visible;
        background: #fff;
    }

    .deck-viewport {
        position: static;
        overflow: visible;
        background: #fff;
    }

    .deck-stage {
        position: static;
        width: auto;
        height: auto;
        transform: none !important;
        background: none;
    }

    .slide {
        position: relative;
        display: block !important;
        visibility: visible !important;
        opacity: 1 !important;
        pointer-events: auto !important;
        width: 1920px;
        height: 1080px;
        break-after: page;
        page-break-after: always;
    }

    .slide:last-child {
        break-after: auto;
        page-break-after: auto;
    }

    .deck-controls {
        display: none !important;
    }
}

/* 8. Reduced motion */
@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.2s !important;
    }
}


/* === SHARED TYPOGRAPHY AND SPACING === */
*{box-sizing:border-box} :root{--ink:#202c3b;--accent:#315c91;--muted:#526173;--line:#bfc8cf;--slide-bg:#f5f3ed;--stage-bg:#1d2630}
.slide{color:var(--ink);font-family:'DM Sans',sans-serif;padding:80px 104px}

p{margin:0}.subtitle{font-size:34px;line-height:1.5;color:var(--muted)}
footer{position:absolute;left:104px;right:104px;bottom:64px;display:flex;justify-content:space-between;align-items:center;gap:32px;font-size:25px;line-height:1.4}
.team{max-width:1000px}.team-label{display:block;font:400 17px 'IBM Plex Mono',monospace;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;color:var(--muted)}
.page{font:400 21px 'IBM Plex Mono',monospace}.accent{color:var(--accent)}
.quad{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;width:60px;height:60px}.quad i{background:var(--accent)}
/* === ENTRANCE MOTION === */
.reveal{animation:enter .65s cubic-bezier(.16,1,.3,1) both}.subtitle.reveal{animation-delay:.12s}
@keyframes enter{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){.reveal{animation:none}}


/* === BLUE MARGINALIA === */

/* === ENLARGED TEAM CREDIT === */

/* === QUANTUM FIGURES === */

function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);document.querySelector('.deck-stage').style.transform=`translate(${(innerWidth-1920*s)/2}px,${(innerHeight-1080*s)/2}px) scale(${s})`;}
