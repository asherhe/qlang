<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>qlang</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Tektur:wght@600;800&family=Chakra+Petch:wght@400;600&family=Space+Mono&family=DM+Sans:wght@400;500;700&family=Bodoni+Moda:ital,wght@0,600;1,600&display=swap"><style>/* === FIXED STAGE === */
/* ===========================================
   FIXED 16:9 STAGE: MANDATORY BASE STYLES
   Include this ENTIRE file in every presentation.
   Slides are authored at 1920×1080 and scaled as a whole.
   =========================================== */

/* 1. Lock the browser viewport */
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}

/* 2. Full-window deck viewport */
.deck-viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}

/* 3. Fixed 16:9 design canvas.
   JavaScript sets transform: translate(...) scale(...). */
.deck-stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}

/* 4. Slides stack inside the fixed stage.
   Content must be laid out at 1920×1080, not reflowed per device. */
.slide {
    position: absolute;
    inset: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    display: block;
    visibility: hidden;
    opacity: 0;
    pointer-events: none;
    background: var(--slide-bg, #fff);
}

.slide.active,
.slide.visible {
    visibility: visible;
    opacity: 1;
    pointer-events: auto;
    z-index: 1;
}

/* 5. Keep media inside authored slide bounds */
img,
video,
canvas,
svg {
    max-width: 100%;
    max-height: 100%;
}

/* 6. Presentation chrome stays outside the slide design system */
.deck-controls {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    z-index: 1000;
}

/* 7. Print one fixed-size slide per page */
@media print {
    html,
    body {
        width: 1920px;
        height: auto;
        overflow: visible;
        background: #fff;
    }

    .deck-viewport {
        position: static;
        overflow: visible;
        background: #fff;
    }

    .deck-stage {
        position: static;
        width: auto;
        height: auto;
        transform: none !important;
        background: none;
    }

    .slide {
        position: relative;
        display: block !important;
        visibility: visible !important;
        opacity: 1 !important;
        pointer-events: auto !important;
        width: 1920px;
        height: 1080px;
        break-after: page;
        page-break-after: always;
    }

    .slide:last-child {
        break-after: auto;
        page-break-after: auto;
    }

    .deck-controls {
        display: none !important;
    }
}

/* 8. Reduced motion */
@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.2s !important;
    }
}

:root{--slide-bg:#0a0e27;--stage-bg:#050715}.slide{font-family:'Chakra Petch';color:white;background-image:linear-gradient(#5edcf40c 1px,transparent 1px),linear-gradient(90deg,#5edcf40c 1px,transparent 1px);background-size:40px 40px}header,footer{font-family:'Space Mono';color:#5edcf4}h1{font-family:Tektur;font-size:148px;max-width:1300px;margin-top:120px;letter-spacing:-4px}h1 span{color:#f4d03f;text-shadow:8px 8px 0 #283561}.sub{color:#e2d5f2;margin-top:48px}.glyph{position:absolute;right:110px;top:360px;font-family:'Space Mono';font-size:210px;color:#5edcf4;transform:rotate(-8deg)}.tag{border:4px solid #5edcf4;padding:12px 24px;box-shadow:8px 8px 0 #243353}</style></head><body><div class="deck-viewport"><main class="deck-stage"><section class="slide active"><header><b class="tag">qlang</b><span>QISKIT / GROVER SEARCH</span></header><h1 class="reveal">Your problem.<br><span>Quantum-powered.</span></h1><p class="sub reveal">Write expressions. Discover the circuit beneath.</p><div class="glyph">|??</div><footer><span>EXPRESSION ? ORACLE ? SEARCH</span><span>01</span></footer></section></main></div><script>function fit(){let s=Math.min(innerWidth/1920,innerHeight/1080);document.querySelector('.deck-stage').style.transform=`translate(${(innerWidth-1920*s)/2}px,${(innerHeight-1080*s)/2}px) scale(${s})`}addEventListener('resize',fit);fit();</script></body></html>
